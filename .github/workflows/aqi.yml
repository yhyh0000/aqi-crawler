name: AQI Crawler

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run AQI Crawler
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: python aqi_crawler.py
      - name: Commit updates
        run: |
          git config user.name "AQI Bot"
          git config user.email "aqi-bot@github.com"
          git add README.md data/
          git diff --staged --quiet || git commit -m "Update AQI $(date +%Y-%m-%d_%H:%M)"
          git push
